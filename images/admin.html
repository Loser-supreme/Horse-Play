<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Elena Moore Massages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1218;
      --bg-card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --text: #e8d5d0;
      --text-muted: #a08088;
      --accent: #d4a5a5;
      --accent-soft: #b88888;
      --danger: #e57373;
      --danger-hover: #ef5350;
      --success: #81c784;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      max-width: 400px;
      margin: 0 auto 2rem;
    }
    .login-box label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .login-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    .login-box input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      color: var(--bg);
    }
    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-danger {
      background: var(--danger);
      color: white;
      padding: 8px 16px;
      width: auto;
      font-size: 0.75rem;
    }
    .btn-danger:hover {
      background: var(--danger-hover);
    }
    .status {
      text-align: center;
      padding: 0.8rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      display: none;
    }
    .status.error { background: rgba(229,115,115,0.15); color: var(--danger); display: block; }
    .status.success { background: rgba(129,199,132,0.15); color: var(--success); display: block; }
    .reviews-list { margin-top: 2rem; }
    .review-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      transition: all 0.2s ease;
    }
    .review-item:hover {
      border-color: rgba(212,165,165,0.2);
    }
    .review-content { flex: 1; }
    .review-stars { color: var(--accent); font-size: 0.9rem; margin-bottom: 0.4rem; }
    .review-text {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }
    .review-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem;
      font-size: 0.9rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin Panel</h1>
    <p class="subtitle">Elena Moore Massages — Review Moderation</p>

    <div id="loginBox" class="login-box">
      <div id="status" class="status"></div>
      <label for="adminSecret">Admin Secret</label>
      <input type="password" id="adminSecret" placeholder="Enter your admin secret...">
      <button class="btn btn-primary" id="loginBtn">Access Reviews</button>
    </div>

    <div id="reviewsSection" class="hidden">
      <div id="reviewsList" class="reviews-list"></div>
    </div>
  </div>

  <script>
    const API_URL = '/api/reviews';
    const loginBox = document.getElementById('loginBox');
    const reviewsSection = document.getElementById('reviewsSection');
    const reviewsList = document.getElementById('reviewsList');
    const adminSecretInput = document.getElementById('adminSecret');
    const loginBtn = document.getElementById('loginBtn');
    const statusEl = document.getElementById('status');

    let currentSecret = '';

    function showStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
      setTimeout(() => { statusEl.className = 'status'; }, 3000);
    }

    function createStars(rating) {
      return '★'.repeat(rating) + '☆'.repeat(5 - rating);
    }

    async function loadReviews() {
      try {
        const res = await fetch(API_URL);
        const reviews = await res.json();
        renderReviews(reviews);
      } catch (err) {
        reviewsList.innerHTML = '<div class="empty-state">Failed to load reviews.</div>';
      }
    }

    function renderReviews(reviews) {
      if (!reviews || reviews.length === 0) {
        reviewsList.innerHTML = '<div class="empty-state">No reviews yet.</div>';
        return;
      }

      reviewsList.innerHTML = reviews.map(r => `
        <div class="review-item" data-id="${r.id || ''}">
          <div class="review-content">
            <div class="review-stars">${createStars(r.rating)}</div>
            <div class="review-text">"${escapeHtml(r.text)}"</div>
            <div class="review-meta">${escapeHtml(r.name)} · ${escapeHtml(r.service)} · ${escapeHtml(r.date)}</div>
          </div>
          <button class="btn btn-danger" onclick="deleteReview('${r.id}')">Delete</button>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function deleteReview(id) {
      if (!confirm('Delete this review permanently?')) return;

      try {
        const res = await fetch(API_URL, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Secret': currentSecret,
          },
          body: JSON.stringify({ id }),
        });

        if (res.ok) {
          showStatus('Review deleted.', 'success');
          loadReviews();
        } else if (res.status === 401) {
          showStatus('Session expired. Please re-enter secret.', 'error');
          logout();
        } else {
          showStatus('Delete failed.', 'error');
        }
      } catch (err) {
        showStatus('Network error.', 'error');
      }
    }

    function logout() {
      currentSecret = '';
      loginBox.classList.remove('hidden');
      reviewsSection.classList.add('hidden');
      adminSecretInput.value = '';
    }

    loginBtn.addEventListener('click', async () => {
      const secret = adminSecretInput.value.trim();
      if (!secret) {
        showStatus('Please enter the admin secret.', 'error');
        return;
      }

      // Verify by attempting a harmless delete with a fake ID
      try {
        const res = await fetch(API_URL, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Secret': secret,
          },
          body: JSON.stringify({ id: 'test-verify' }),
        });

        if (res.status === 401) {
          showStatus('Invalid admin secret.', 'error');
          return;
        }

        // Secret is valid (even if the test ID wasn't found)
        currentSecret = secret;
        loginBox.classList.add('hidden');
        reviewsSection.classList.remove('hidden');
        loadReviews();
      } catch (err) {
        showStatus('Connection failed.', 'error');
      }
    });

    // Allow Enter key
    adminSecretInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });
  </script>
</body>
</html>
